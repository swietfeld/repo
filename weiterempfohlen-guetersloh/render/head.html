<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0;padding:0;background:#888}
section{width:1920px;height:1080px;position:relative;box-sizing:border-box;overflow:hidden}
section *{box-sizing:border-box}
h1,h2,h3,p,ul,ol,table{margin:0}
aside{display:none}
x-icon{display:inline-block;flex:none;border-radius:50%;border:4px solid currentColor}
x-shape{display:block;flex:none}
x-shape[kind=arrow-right]{clip-path:polygon(0 30%,60% 30%,60% 0,100% 50%,60% 100%,60% 70%,0 70%)}
table{border-collapse:collapse}
th,td{padding:0.35em 0.6em;border-bottom:1px solid #cfc6b4;vertical-align:top}
th{font-weight:700}
hr{border:none;margin:0;width:100%}
</style></head><body>
